<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../project-page-styles.2.css">
  <title>Jack Fuller: SPMT</title>
  <link rel="stylesheet" href="../../headerstyle.css">
  <script src="../../header-loader.js" defer></script>

</head>
<body data-page="architecture">
  <div id="header-placeholder"></div>

  <div class="page-below-header">
    <!-- HERO: replace the title, date, description, metadata, and image -->
    <section class="hero">
      <div class="hero-text">
        <h1>Spatial Membrane</h1>
        <span class="date">Fall 2025</span>
        <p>
          A continuous surface starting from a flat rectangle that creates space as it bends and twists. The form of the surface
          is represented through a variety of methods.
        </p>

        <div class="meta">
          <div class="meta-item">
            <span class="meta-label">Type</span>
            <span class="meta-value">First Year Representation Project</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Tools</span>
            <span class="meta-value">Rhino, Illustrator, Grasshopper</span>
          </div>
        </div>
      </div>

      <div class="hero-image">
        <img src="matrix_contours copy.webp" alt="Hero image for project" />
      </div>
    </section>

    <section class="project-section">

      <!-- FULL-WIDTH IMAGE WITH CAPTION -->
      <figure class="full-image">
        <div class="full-image-frame">
          <img src="SPMT_xldraw2_pdf2_comp_page-0001.webp" alt="Large project image" />
        </div>
        <figcaption class="image-caption">
          Experiential view
        </figcaption>
      </figure>



  <!-- FULL WIDTH CAROUSEL IMAGES-->
  
  <div class="full-carousel-block" data-full-carousel>
    <button class="full-carousel-button prev" type="button" aria-label="Previous image">
      &#8592;
    </button>
  
    <div class="full-carousel-viewport">
      <div class="full-carousel-track">
        <figure class="full-carousel-slide">
          <img src="matrix_curvanal copy.webp"  />
          <figcaption class="full-carousel-caption">
            Curvature analysis
          </figcaption>
        </figure>
  
        <figure class="full-carousel-slide">
          <img src="matrix_diagrid copy.webp" alt="Model view two" />
          <figcaption class="full-carousel-caption">
            Diagrid structure generated in Grasshopper
          </figcaption>
        </figure>
  
        <figure class="full-carousel-slide">
          <img src="matrix_iso copy.webp" alt="Model view three" />
          <figcaption class="full-carousel-caption">
            Isocurve analysis
          </figcaption>
        </figure>

        <figure class="full-carousel-slide">
          <img src="matrix_tri copy.webp" alt="Model view three" />
          <figcaption class="full-carousel-caption">
            Triangular paneling structure generated in Grasshopper
          </figcaption>
        </figure>

        <figure class="full-carousel-slide">
          <img src="matrix_zebra copy.webp" alt="Model view three" />
          <figcaption class="full-carousel-caption">
            Zebra stripe analysis
          </figcaption>
        </figure>
      </div>
    </div>
  
    <button class="full-carousel-button next" type="button" aria-label="Next image">
      &#8594;
    </button>
  
    <div class="full-carousel-dots" aria-label="Carousel navigation"></div>
  </div>


</section>
</div>


  <script src="../project-page-script2.js"></script>
</body>
</html>
