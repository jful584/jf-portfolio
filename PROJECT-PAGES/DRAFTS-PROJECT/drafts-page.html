<!DOCTYPE html>

<head>

<body data-page="architecture">
  <div id="header-placeholder"></div>

  <div class="page-below-header">
    <!-- HERO: replace the title, date, description, metadata, and image -->
    <section class="hero">
      <div class="hero-text">
        <h1>Elemental Drafts</h1>
        <span class="date">Fall 2025</span>
        <p>
          A collection of line drawings representing several examples of the core elements of architecture. Some are
          drafted using an axonometric projection, while others are section perspective drawings.
        </p>

        <div class="meta">
          <div class="meta-item">
            <span class="meta-label">Type</span>
            <span class="meta-value">First Year Project</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Tools</span>
            <span class="meta-value">Rhino, Illustrator</span>
          </div>

        </div>
      </div>

      <div class="hero-image">
        <img src="Garage-open-psdGIF.gif" />
      </div>
    </section>

    <section class="project-section">
     

      <!-- FULL-WIDTH IMAGE WITH CAPTION -->
      <figure class="full-image">
        <div class="full-image-frame">
          <img src="MERCEDES_BENZ_ROOF_AXON_F2.gif"  />
        </div>
        <figcaption class="image-caption">
          Roof of Mercedes Benz Stadium in Atlanta
        </figcaption>
      </figure>
    </section>
  </div>
  



  <!-- DOUBLE IMAGES -->


  <div class="double-image-block">
    <div class="double-image-grid">
      <figure class="double-image-item">
        <img src="Sofi_Axon_Slowed.gif" />
        <figcaption>Roof of Sofi Stadium in Inglewood</figcaption>
      </figure>
  
      <figure class="double-image-item">
        <img src="SPACENEEDLE_AXON.jpg" />
        <figcaption>Axon view from the top of the Seattle Space Needle</figcaption>
      </figure>
    </div>
  </div>

  <div class="double-image-block">
    <div class="double-image-grid">
      <figure class="double-image-item">
        <img src="Venice_sidewalkF2.jpg" />
        <figcaption>Section perspective of a sidewalk along the canal in Venice</figcaption>
      </figure>
  
      <figure class="double-image-item">
        <img src="Sidewalk_section_perspective2.jpg" />
        <figcaption>Section perspective of a sidewalk in Shinjuku City, Tokyo</figcaption>
      </figure>
    </div>
  </div>

  <script src="../project-page-script2.js"></script>
